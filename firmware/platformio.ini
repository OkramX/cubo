; Cubo de notificações — PlatformIO
; Compilar:   pio run
; Enviar USB: pio run -t upload
; Enviar OTA: pio run -e cubo_4mb_ota -t upload   (depois do primeiro flash)

[platformio]
default_envs = cubo_4mb

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; Memória flash de 4 MB (o mais comum). Confirma com: esptool.py flash_id
[env:cubo_4mb]
board = esp12e

; Usa este se o flash_id indicar 1 MB
[env:cubo_1mb]
board = esp01_1m

; Atualização sem cabo, depois de o cubo já ter este firmware.
; A palavra-passe é o CUBO_TOKEN do config.h.
[env:cubo_4mb_ota]
board = esp12e
upload_protocol = espota
upload_port = cubo.local
upload_flags =
    --auth=troca-isto-por-um-codigo-teu
